<!DOCTYPE html>
<html>
<!--
  SZABLON X3DOM + JavaScript – wszystko w jednym pliku.
  Zawiera: animację X3D (ROUTE), ruch po okręgu (setInterval), kolor z palety,
  suwak rozmiaru, checkbox światła, dodawanie obiektów, mruganie (render).
  Usuń sekcje, których nie potrzebujesz.
-->
<head>
  <meta charset="utf-8">
  <script src="https://www.x3dom.org/download/x3dom.js"></script>
  <link rel="stylesheet" href="https://www.x3dom.org/download/x3dom.css">
</head>

<body>
  <x3d width="800px" height="500px">
    <scene>
      <navigationInfo type='"EXAMINE" "ANY"' headlight="false"></navigationInfo>
      <viewpoint position="0 0 40"></viewpoint>
      <background skyColor="0.1 0.1 0.2"></background>

      <directionalLight direction="-1 -1 -1" intensity="0.8"></directionalLight>
      <pointLight id="zarowka" location="0 8 5" color="1 0.8 0.6" intensity="0.6" radius="40"></pointLight>
      <spotLight id="latarka" on="true" color="1 1 0.6" location="0 0 25" direction="0 0 -1"
                 cutOffAngle="0.6" beamWidth="0.5" radius="60"></spotLight>

      <!-- 1. Kostka obracana przez X3D (TimeSensor + Interpolator + ROUTE) -->
      <transform DEF="kostka" translation="-10 0 0">
        <shape>
          <appearance><material id="matKostki" diffuseColor="0 0 1"></material></appearance>
          <box size="4 4 4"></box>
        </shape>
      </transform>
      <timeSensor DEF="czas" cycleInterval="4" loop="true"></timeSensor>
      <orientationInterpolator DEF="obrot" key="0 0.25 0.5 0.75 1"
        keyValue="0 1 0 0, 0 1 0 1.57, 0 1 0 3.14, 0 1 0 4.71, 0 1 0 6.28"></orientationInterpolator>
      <ROUTE fromNode="czas" fromField="fraction_changed" toNode="obrot" toField="set_fraction"></ROUTE>
      <ROUTE fromNode="obrot" fromField="value_changed" toNode="kostka" toField="rotation"></ROUTE>

      <!-- 2. Kula poruszana z JS po okręgu -->
      <transform id="punkt" translation="10 0 0">
        <shape>
          <appearance><material id="matKuli" diffuseColor="1 0 0"></material></appearance>
          <sphere id="kula" radius="2"></sphere>
        </shape>
      </transform>

      <!-- 3. "Oczy" ukrywane atrybutem render (mruganie) -->
      <transform id="oczy" translation="-10 6 0" render="true">
        <transform translation="-1 0 0">
          <shape><appearance><material diffuseColor="1 1 1" emissiveColor="1 1 1"></material></appearance><sphere radius="0.5"></sphere></shape>
        </transform>
        <transform translation="1 0 0">
          <shape><appearance><material diffuseColor="1 1 1" emissiveColor="1 1 1"></material></appearance><sphere radius="0.5"></sphere></shape>
        </transform>
      </transform>

      <!-- 4. Tekst -->
      <transform translation="0 -10 0">
        <shape>
          <appearance><material diffuseColor="1 1 1" emissiveColor="0.6 0.6 0.6"></material></appearance>
          <text string='"Imie Nazwisko" "grupa X"' solid="false">
            <fontStyle justify='"MIDDLE" "MIDDLE"' size="2"></fontStyle>
          </text>
        </shape>
      </transform>
    </scene>
  </x3d>

  <div>
    <button onclick="startOkrag()">Ruch po okręgu</button>
    <button onclick="stopOkrag()">Stop</button>
    <button onclick="mrugnij()">Mrugnij</button>
    <button onclick="dodajObiekt()">Dodaj obiekt</button>
    <span id="licznik">Obiektów: 0</span>
  </div>
  <div>
    <label>Kolor kuli:</label>
    <input type="color" id="paleta" value="#ff0000">
    <label>Rozmiar kuli:</label>
    <input type="range" id="suwak" min="0.5" max="5" step="0.1" value="2">
    <span id="rozmiar">2</span>
    <label><input type="checkbox" checked onclick="przelaczSwiatlo(this.checked)"> latarka</label>
  </div>

  <script>
    // ---------- pomocnicze ----------
    function hexToRGB(hex) {
      const r = parseInt(hex.substring(1, 3), 16) / 255;
      const g = parseInt(hex.substring(3, 5), 16) / 255;
      const b = parseInt(hex.substring(5, 7), 16) / 255;
      return `${r} ${g} ${b}`;
    }

    // ---------- ruch po okręgu ----------
    let timer = null;
    let kat = 0;
    function startOkrag() {
      if (timer) return;
      timer = setInterval(function () {
        kat += 0.03;
        const x = Math.cos(kat) * 10;
        const y = Math.sin(kat) * 10;
        document.getElementById('punkt').setAttribute('translation', `${x} ${y} 0`);
      }, 16);
    }
    function stopOkrag() {
      clearInterval(timer);
      timer = null;
    }

    // ---------- mruganie ----------
    function mrugnij() {
      const oczy = document.getElementById('oczy');
      oczy.setAttribute('render', 'false');
      setTimeout(function () { oczy.setAttribute('render', 'true'); }, 150);
    }
    setInterval(mrugnij, 3000);

    // ---------- kolor z palety ----------
    document.getElementById('paleta').addEventListener('input', function () {
      document.getElementById('matKuli').setAttribute('diffuseColor', hexToRGB(this.value));
    });

    // ---------- suwak ----------
    const suwak = document.getElementById('suwak');
    suwak.addEventListener('input', function () {
      document.getElementById('kula').setAttribute('radius', suwak.value);
      document.getElementById('rozmiar').textContent = suwak.value;
    });

    // ---------- checkbox ----------
    function przelaczSwiatlo(wlaczone) {
      document.getElementById('latarka').setAttribute('on', wlaczone ? 'true' : 'false');
    }

    // ---------- dodawanie obiektów ----------
    let ile = 0;
    function dodajObiekt() {
      const x = -15 + ile * 3;
      const kolor = `${Math.random()} ${Math.random()} ${Math.random()}`;
      document.querySelector('scene').insertAdjacentHTML('beforeend',
        `<transform translation="${x} 12 0">
           <shape>
             <appearance><material diffuseColor="${kolor}"></material></appearance>
             <box size="2 2 2"></box>
           </shape>
         </transform>`);
      ile++;
      document.getElementById('licznik').textContent = `Obiektów: ${ile}`;
    }
  </script>
</body>
</html>
